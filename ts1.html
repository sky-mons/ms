<!DOCTYPE html>
<html>
<head>
  <title>PCR 1 Monitor Stack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styling.css">
  <script src="moncontent.js"> </script>
</head>
<body>

<h1>PCR 1 Technical Supervisor Monitor Stack</h1>

    
  <table class="monstack">
    <colgroup>
      <col />
      <col />
      <col />
    </colgroup>
    <tbody>
      <tr>
        <td style="height: 40px">TS Mon 7: <input type="text" style="height: 30px"></td>
        <td style="height: 40px">TS Mon 8: <input type="text" style="height: 30px"></td>
        <td style="height: 40px">TS Mon 9: <input type="text" style="height: 30px"></td>
      </tr>
      <tr>
        <td>
          <div id="Tab1" class="tab">
            <button class="tablinks" onclick="openLayout('A', 'Mon1')">Full</button>
            <button class="tablinks" onclick="openLayout('C', 'Mon1')" id="defaultOpen1">4-way</button>
            <button class="tablinks" onclick="openLayout('1E7', 'Mon1')">7-way</button>
            <button class="tablinks" onclick="openLayout('1I8', 'Mon1')">8-way</button>
            <button class="tablinks" onclick="openLayout('F', 'Mon1')">9-way</button>
            <button class="tablinks" onclick="openLayout('GG', 'Mon1')">10-way</button>
            <button class="tablinks" onclick="openLayout('H', 'Mon1')">16-way</button>
          </div>
          <div id="Mon1" class="moncontent" />
        </td>
        <td>
          <div id="Tab2" class="tab">
            <button class="tablinks" onclick="openLayout('C', 'Mon2')" id="defaultOpen2">4-way</button>
            <button class="tablinks" onclick="openLayout('1E7', 'Mon2')">7-way</button>
            <button class="tablinks" onclick="openLayout('F', 'Mon2')">9-way</button>
            <button class="tablinks" onclick="openLayout('GG', 'Mon2')">10-way</button>
            <button class="tablinks" onclick="openLayout('1J10', 'Mon2')">10-way</button>
            <button class="tablinks" onclick="openLayout('H', 'Mon2')">16-way</button>
          </div>
          <div id="Mon2" class="moncontent" />
        </td>
        <td>
          <div id="Tab3" class="tab">
            <button class="tablinks" onclick="openLayout('C', 'Mon3')" id="defaultOpen3">4-way</button>
            <button class="tablinks" onclick="openLayout('1A5', 'Mon3')">5-way</button>
            <button class="tablinks" onclick="openLayout('1B7', 'Mon3')">7-way</button>
            <button class="tablinks" onclick="openLayout('1I8', 'Mon3')">8-way</button>  
            <button class="tablinks" onclick="openLayout('P', 'Mon3')">10-way</button>
            <button class="tablinks" onclick="openLayout('GG', 'Mon3')">10-way</button>
            <button class="tablinks" onclick="openLayout('H', 'Mon3')">16</button>
          </div>
          <div id="Mon3" class="moncontent" />
        </td>
      </tr>

      <tr>
        <td style="height: 40px">TS Mon 4:   TS MVWR 1</td>
        <td style="height: 40px">TS Mon 5: <input type="text" style="height: 30px"></td>
        <td style="height: 40px">TS Mon 6:   TS MVWR 2</td>
      </tr>
        <td>
          <div id="Tab4" class="tab">
            <button class="tablinks" onclick="openLayout('A', 'Mon4')">Full</button>
            <button class="tablinks" onclick="openLayout('C', 'Mon4')">4-way</button>
            <button class="tablinks" onclick="openLayout('1A5', 'Mon4')">5-way</button>
            <button class="tablinks" onclick="openLayout('1I8', 'Mon4')">8-way</button>
            <button class="tablinks" onclick="openLayout('P', 'Mon4')" id="defaultOpen4">10-way</button>
            <button class="tablinks" onclick="openLayout('H', 'Mon4')">16-way</button>
          </div>
          <div id="Mon4" class="moncontent" />
        </td>
        <td>
          <div id="Tab5" class="tab">
            <button class="tablinks" onclick="openLayout('C', 'Mon5')">4-way</button>
            <button class="tablinks" onclick="openLayout('1H8', 'Mon5')">8-way</button>
            <button class="tablinks" onclick="openLayout('F', 'Mon5')">9-way</button>
            <button class="tablinks" onclick="openLayout('P', 'Mon5')" id="defaultOpen5">10-way</button>
            <button class="tablinks" onclick="openLayout('1J10', 'Mon5')">10-way</button>
            <button class="tablinks" onclick="openLayout('1P13', 'Mon5')">13-way</button>
            <button class="tablinks" onclick="openLayout('H', 'Mon5')">16</button>
          </div>
          <div id="Mon5" class="moncontent" />
        </td>
        <td>
          <div id="Tab6" class="tab">
            <button class="tablinks" onclick="openLayout('A', 'Mon6')">Full</button>
            <button class="tablinks" onclick="openLayout('C', 'Mon6')">4-way</button>
            <button class="tablinks" onclick="openLayout('F', 'Mon6')" id="defaultOpen6">9-way</button>
            <button class="tablinks" onclick="openLayout('GG', 'Mon6')">10-way</button>
            <button class="tablinks" onclick="openLayout('1L13', 'Mon6')">13-way</button>
            <button class="tablinks" onclick="openLayout('H', 'Mon6')">16-way</button>
          </div>
          <div id="Mon6" class="moncontent" />
        </td>
      </tr>
    </tbody>
  </table>

</body>
<script>{openDefaults();}</script>
</html>
