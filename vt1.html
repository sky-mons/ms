<!DOCTYPE html>
<html>
<head>
  <title>Replay 1 VT Co-Ordinator Monitor Stack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styling.css">
  <script src="moncontent.js"> </script>
</head>
<body>

<h1>Replay 1 VT Co-Ordinator Monitor Stack</h1>
    
  <table class="monstack">
    <colgroup>
      <col />
    </colgroup>
    <tbody>
      <tr>
        <td>
          <div id="Tab1" class="tab">
            <button class="tablinks" onclick="openLayout('A', 'Mon1')">Full</button>
            <button class="tablinks" onclick="openLayout('C', 'Mon1')">4-way</button>
            <button class="tablinks" onclick="openLayout('F', 'Mon1')">9-way</button>
            <button class="tablinks" onclick="openLayout('N', 'Mon1')" id="defaultOpen1">Co-ord 1</button>
          </div>
          <div id="Mon1" class="moncontent" />
        </td>
      <tr>
        <td>
          <div id="Tab2" class="tab">
            <button class="tablinks" onclick="openLayout('A', 'Mon2')">Full</button>
            <button class="tablinks" onclick="openLayout('C', 'Mon2')">4-way</button>
            <button class="tablinks" onclick="openLayout('F', 'Mon2')">9-way</button>
            <button class="tablinks" onclick="openLayout('H', 'Mon2')" id="defaultOpen2">16-way</button>
            <button class="tablinks" onclick="openLayout('N', 'Mon2')">Co-ord 1</button>
          </div>
          <div id="Mon2" class="moncontent" />
        </td>
    </tbody>
  </table>

</body>
<script>{openDefaults();}</script>
</html>
